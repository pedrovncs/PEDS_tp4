<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meus Livros </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>📚 Meus Livros</h1>
        <a href="/add" class="btn btn-primary">
            <i class="bi bi-plus-circle-fill"></i> Adicionar Livro
        </a>
    </div>

    <div th:if="${livros.isEmpty()}" class="alert alert-info text-center">
        Nenhum livro encontrado!
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="livro : ${livros}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${livro.titulo}">Book Title</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${livro.autor}">Author</h6>
                    <p class="card-text">
                        <small class="text-muted" th:text="'Published in ' + ${livro.anoPublicacao}">Published in 2023</small>
                    </p>
                </div>
                <div class="card-footer bg-transparent border-0 d-flex justify-content-end gap-2">
                    <a th:href="@{/edit/{id}(id=${livro.id})}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-pencil-square"></i> Edit
                    </a>
                    <form th:action="@{/delete/{id}(id=${livro.id})}" method="post" onsubmit="return confirm('tem certeza que deseja deletar este livro?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-trash3-fill"></i> Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
